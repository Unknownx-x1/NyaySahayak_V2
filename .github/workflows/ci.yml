name: NyaySahayak 2.0 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyaysahayak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pytest-asyncio pytest-cov httpx
          python -m pip install -r apps/api/requirements.txt

      - name: Ruff Linter Check
        run: python -m ruff check apps/api

      - name: Ruff Formatter Check
        run: python -m ruff format --check apps/api

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nyaysahayak_test
          SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nyaysahayak_test
        run: |
          cd apps/api && alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nyaysahayak_test
          SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nyaysahayak_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          python -m pytest -v 2>&1 | tee /tmp/pytest.log || {
            echo "### Pytest Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Production Build & Lint Verification
        run: npm run build
